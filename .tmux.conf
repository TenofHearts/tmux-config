# Advertise 256 colors so zsh's indexed syntax-highlighting colors work.
# screen-256color is widely available across Linux, macOS, and WSL.
set -g default-terminal 'screen-256color'

# Make Escape responsive while allowing a short window for Alt-key sequences.
set -s escape-time 10

# Prefix and direct shortcuts.
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind b previous-window
# One-key close prompts appear in the status bar; Escape cancels.
bind x command-prompt -1 -p 'Close pane #P? x: yes | Esc: no' "if-shell -F '#{==:%%,x}' 'kill-pane'"
bind & command-prompt -1 -p 'Close window #W? x: yes | Esc: no' "if-shell -F '#{==:%%,x}' 'kill-window'"

# Leave Alt navigation to the desktop window manager, including GlazeWM.
unbind -n M-Left
unbind -n M-Right
unbind -n M-Up
unbind -n M-Down
set -g mouse on
set -g allow-rename off
setw -g mode-keys vi

# Locate help beside this config, including relative ~/.tmux.conf symlinks.
# This uses portable readlink, rather than GNU-only readlink -f.
run-shell 'config=#{q:current_file}; while [ -L "$config" ]; do target=$(readlink "$config"); case "$target" in /*) config=$target ;; *) config=$(dirname "$config")/$target ;; esac; done; tmux set-option -g @modal-help "$(dirname "$config")/scripts/mode-help.sh"'

# Remove the former help bindings when reloading an existing server.
unbind -n C-h
unbind -q -T tmux-window C-h
unbind -q -T tmux-pane C-h
unbind -q -T tmux-resize C-h
unbind -T copy-mode C-h
bind -T copy-mode-vi C-h send-keys -X cursor-left

# All actions re-enter their table. Enter/Escape exit; ? exits into help.
# Unknown keys are consumed so they cannot accidentally type into the shell.
bind -N 'Enter pane mode' p switch-client -T tmux-pane
bind -N 'Enter resize mode' r switch-client -T tmux-resize
bind -N 'Open window picker; selection enters window mode' w {
    switch-client -T root
    set -p @modal-picker windows
    choose-tree -Zw "switch-client -t '%%'; switch-client -T tmux-window"
}
bind -N 'Open session picker' s {
    switch-client -T root
    set -p @modal-picker sessions
    choose-tree -Zs
}

# Windows: h/l switch windows; j/k switch sessions.
bind -T tmux-window -N 'Previous window' h { switch-client -T tmux-window; previous-window }
bind -T tmux-window -N 'Next window' l { switch-client -T tmux-window; next-window }
bind -T tmux-window -N 'Next session' j { switch-client -T tmux-window; switch-client -n; switch-client -T tmux-window }
bind -T tmux-window -N 'Previous session' k { switch-client -T tmux-window; switch-client -p; switch-client -T tmux-window }
bind -T tmux-window -N 'Previous window' Left { switch-client -T tmux-window; previous-window }
bind -T tmux-window -N 'Next window' Right { switch-client -T tmux-window; next-window }
bind -T tmux-window -N 'Next session' Down { switch-client -T tmux-window; switch-client -n; switch-client -T tmux-window }
bind -T tmux-window -N 'Previous session' Up { switch-client -T tmux-window; switch-client -p; switch-client -T tmux-window }
bind -T tmux-window -N 'Previously active window' Tab { switch-client -T tmux-window; last-window }
bind -T tmux-window -N 'Select window 0' 0 { switch-client -T tmux-window; select-window -t :0 }
bind -T tmux-window -N 'Select window 1' 1 { switch-client -T tmux-window; select-window -t :1 }
bind -T tmux-window -N 'Select window 2' 2 { switch-client -T tmux-window; select-window -t :2 }
bind -T tmux-window -N 'Select window 3' 3 { switch-client -T tmux-window; select-window -t :3 }
bind -T tmux-window -N 'Select window 4' 4 { switch-client -T tmux-window; select-window -t :4 }
bind -T tmux-window -N 'Select window 5' 5 { switch-client -T tmux-window; select-window -t :5 }
bind -T tmux-window -N 'Select window 6' 6 { switch-client -T tmux-window; select-window -t :6 }
bind -T tmux-window -N 'Select window 7' 7 { switch-client -T tmux-window; select-window -t :7 }
bind -T tmux-window -N 'Select window 8' 8 { switch-client -T tmux-window; select-window -t :8 }
bind -T tmux-window -N 'Select window 9' 9 { switch-client -T tmux-window; select-window -t :9 }
bind -T tmux-window -N 'Create window in current directory' c { switch-client -T tmux-window; new-window -c "#{pane_current_path}" }
bind -T tmux-window -N 'Rename window' r {
    command-prompt -I '#W' "rename-window -- '%%'; switch-client -T tmux-window"
    switch-client -T tmux-window
}
bind -T tmux-window -N 'Open window picker' w {
    switch-client -T root
    set -p @modal-picker windows
    choose-tree -Zw "switch-client -t '%%'; switch-client -T tmux-window"
}
bind -T tmux-window -N 'Open session picker; selection returns to window mode' s {
    switch-client -T root
    set -p @modal-picker sessions
    choose-tree -Zs "switch-client -t '%%'; switch-client -T tmux-window"
}
bind -T tmux-window -N 'Confirm closing window' x {
    command-prompt -1 -p 'Close window #W? x: yes | Esc: no' "if-shell -F '#{==:%%,x}' 'kill-window; switch-client -T tmux-window'"
    switch-client -T tmux-window
}
bind -T tmux-window -N 'Exit mode' Escape switch-client -T root
bind -T tmux-window -N 'Exit mode' Enter switch-client -T root
bind -T tmux-window -N 'Help; exit mode' '?' {
    switch-client -T root
    display-popup -E -w 90% -h 85% 'sh "$(tmux show-option -gv @modal-help)" tmux-window "${TMUX%%,*}"'
}
bind -T tmux-window -N 'Ignore unbound keys; stay in mode' Any switch-client -T tmux-window

# Panes: splitting, navigation, layout, and zoom all stay in mode.
bind -T tmux-pane -N 'Focus left' h { switch-client -T tmux-pane; select-pane -L }
bind -T tmux-pane -N 'Focus down' j { switch-client -T tmux-pane; select-pane -D }
bind -T tmux-pane -N 'Focus up' k { switch-client -T tmux-pane; select-pane -U }
bind -T tmux-pane -N 'Focus right' l { switch-client -T tmux-pane; select-pane -R }
bind -T tmux-pane -N 'Focus left' Left { switch-client -T tmux-pane; select-pane -L }
bind -T tmux-pane -N 'Focus down' Down { switch-client -T tmux-pane; select-pane -D }
bind -T tmux-pane -N 'Focus up' Up { switch-client -T tmux-pane; select-pane -U }
bind -T tmux-pane -N 'Focus right' Right { switch-client -T tmux-pane; select-pane -R }
bind -T tmux-pane -N 'Previously active pane' Tab { switch-client -T tmux-pane; last-pane }
bind -T tmux-pane -N 'Split side by side' '|' { switch-client -T tmux-pane; split-window -h -c "#{pane_current_path}" }
bind -T tmux-pane -N 'Split top and bottom' '-' { switch-client -T tmux-pane; split-window -v -c "#{pane_current_path}" }
bind -T tmux-pane -N 'Split top and bottom' '=' { switch-client -T tmux-pane; split-window -v -c "#{pane_current_path}" }
bind -T tmux-pane -N 'Toggle pane zoom' z { switch-client -T tmux-pane; resize-pane -Z }
bind -T tmux-pane -N 'Cycle pane layouts' Space { switch-client -T tmux-pane; next-layout }
bind -T tmux-pane -N 'Swap with previous pane' '{' { switch-client -T tmux-pane; swap-pane -U }
bind -T tmux-pane -N 'Swap with next pane' '}' { switch-client -T tmux-pane; swap-pane -D }
bind -T tmux-pane -N 'Move pane into its own window' '!' { switch-client -T tmux-pane; break-pane }
bind -T tmux-pane -N 'Confirm closing pane' x {
    command-prompt -1 -p 'Close pane #P? x: yes | Esc: no' "if-shell -F '#{==:%%,x}' 'kill-pane; switch-client -T tmux-pane'"
    switch-client -T tmux-pane
}
bind -T tmux-pane -N 'Exit mode' Escape switch-client -T root
bind -T tmux-pane -N 'Exit mode' Enter switch-client -T root
bind -T tmux-pane -N 'Help; exit mode' '?' {
    switch-client -T root
    display-popup -E -w 90% -h 85% 'sh "$(tmux show-option -gv @modal-help)" tmux-pane "${TMUX%%,*}"'
}
bind -T tmux-pane -N 'Ignore unbound keys; stay in mode' Any switch-client -T tmux-pane

# Resize: two cells with lowercase keys/arrows, ten with uppercase keys.
bind -T tmux-resize -N 'Resize left by 2 cells' h { switch-client -T tmux-resize; resize-pane -L 2 }
bind -T tmux-resize -N 'Resize down by 2 cells' j { switch-client -T tmux-resize; resize-pane -D 2 }
bind -T tmux-resize -N 'Resize up by 2 cells' k { switch-client -T tmux-resize; resize-pane -U 2 }
bind -T tmux-resize -N 'Resize right by 2 cells' l { switch-client -T tmux-resize; resize-pane -R 2 }
bind -T tmux-resize -N 'Resize left by 2 cells' Left { switch-client -T tmux-resize; resize-pane -L 2 }
bind -T tmux-resize -N 'Resize down by 2 cells' Down { switch-client -T tmux-resize; resize-pane -D 2 }
bind -T tmux-resize -N 'Resize up by 2 cells' Up { switch-client -T tmux-resize; resize-pane -U 2 }
bind -T tmux-resize -N 'Resize right by 2 cells' Right { switch-client -T tmux-resize; resize-pane -R 2 }
bind -T tmux-resize -N 'Resize left by 10 cells' H { switch-client -T tmux-resize; resize-pane -L 10 }
bind -T tmux-resize -N 'Resize down by 10 cells' J { switch-client -T tmux-resize; resize-pane -D 10 }
bind -T tmux-resize -N 'Resize up by 10 cells' K { switch-client -T tmux-resize; resize-pane -U 10 }
bind -T tmux-resize -N 'Resize right by 10 cells' L { switch-client -T tmux-resize; resize-pane -R 10 }
bind -T tmux-resize -N 'Arrange even columns' '=' { switch-client -T tmux-resize; select-layout even-horizontal }
bind -T tmux-resize -N 'Arrange even rows' '-' { switch-client -T tmux-resize; select-layout even-vertical }
bind -T tmux-resize -N 'Exit mode' Escape switch-client -T root
bind -T tmux-resize -N 'Exit mode' Enter switch-client -T root
bind -T tmux-resize -N 'Help; exit mode' '?' {
    switch-client -T root
    display-popup -E -w 90% -h 85% 'sh "$(tmux show-option -gv @modal-help)" tmux-resize "${TMUX%%,*}"'
}
bind -T tmux-resize -N 'Ignore unbound keys; stay in mode' Any switch-client -T tmux-resize

# Built-in copy mode keeps vi navigation. Help cancels the selection/mode.
bind -T copy-mode-vi -N 'Help; exit copy mode' '?' {
    send-keys -X cancel
    switch-client -T root
    display-popup -E -w 90% -h 85% 'sh "$(tmux show-option -gv @modal-help)" copy-mode-vi "${TMUX%%,*}"'
}
bind -T copy-mode -N 'Help; exit copy mode' '?' {
    send-keys -X cancel
    switch-client -T root
    display-popup -E -w 90% -h 85% 'sh "$(tmux show-option -gv @modal-help)" copy-mode "${TMUX%%,*}"'
}

# Pickers have built-in controls rather than a customizable key table.
# Intercept ? only there; otherwise forward it to the application.
bind -n '?' if-shell -F '#{==:#{pane_mode},tree-mode}' {
    if-shell -F '#{==:#{@modal-picker},sessions}' {
        send-keys Escape
        switch-client -T root
        display-popup -E -w 90% -h 85% 'sh "$(tmux show-option -gv @modal-help)" sessions-picker "${TMUX%%,*}"'
    } {
        send-keys Escape
        switch-client -T root
        display-popup -E -w 90% -h 85% 'sh "$(tmux show-option -gv @modal-help)" windows-picker "${TMUX%%,*}"'
    }
} {
    send-keys '?'
}

# Client-specific badges avoid changing other clients' status colors.
set -g status-left-length 120
set -g status-left '#{?#{==:#{client_key_table},prefix},#[bg=colour220#,fg=colour0#,bold] COMMAND MODE #[default] w windows | p panes | r resize | s sessions | ? keys ,#{?#{==:#{client_key_table},tmux-window},#[bg=colour33#,fg=colour231#,bold] WINDOWS #[default] h/l windows j/k sessions | ? help | Esc exit ,#{?#{==:#{client_key_table},tmux-pane},#[bg=colour28#,fg=colour231#,bold] PANES #[default] hjkl focus | |/-/= split | z zoom | ? help ,#{?#{==:#{client_key_table},tmux-resize},#[bg=colour166#,fg=colour231#,bold] RESIZE #[default] hjkl 2 / HJKL 10 | = columns - rows | ? help ,#{?#{==:#{pane_mode},tree-mode},#[bg=colour33#,fg=colour231#,bold] #{?#{==:#{@modal-picker},sessions},SESSIONS,WINDOWS} PICKER #[default] hjkl browse | Enter select | ? help | q cancel ,#{?#{==:#{pane_mode},copy-mode},#[bg=colour99#,fg=colour231#,bold] COPY #[default] hjkl scroll | Space select | Enter copy | ? help ,#[bg=colour238#,fg=colour255] #S #[default] }}}}}}'
